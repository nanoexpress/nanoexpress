name: Dependabot auto-merge

# pull_request_target is required for dependabot PRs (secrets are withheld
# from pull_request runs for them); this workflow never checks out PR code
on: pull_request_target

permissions:
  contents: write

jobs:
  auto-merge:
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: ahmadnassri/action-dependabot-auto-merge@v2.6.6
        with:
          target: minor
          approve: true
          github-token: ${{ secrets.GH_TOKEN }}
