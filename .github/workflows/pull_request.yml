# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Linting, Testing and Auto-merge

# pull_request: lint/test jobs run on the PR head without repo secrets.
# pull_request_target: only the dependabot auto-merge job, which never checks
# out PR code, so untrusted code is never executed with secrets access.
on:
  pull_request:
  pull_request_target:

env:
  CI: true

jobs:
  lint_test_build:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - name: Use Bun.sh
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Use Node.js 26 (node:test runtime + uWS binaries)
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install
        run: bun install

      - name: Lint code
        run: bun run lint

      - name: Test code
        run: bun run test
  auto-merge:
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    timeout-minutes: 5

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
      - uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          target: minor
          approve: true
          github-token: ${{ secrets.GH_TOKEN }}
